<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Snowy Sky AI Chat</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
        rel="stylesheet">
    <style>
        :root {
            --card-bg: rgba(15, 23, 42, 0.75);
            --accent-gradient: linear-gradient(135deg, #38bdf8 0%, #0284c7 100%);
            --user-msg-bg: linear-gradient(135deg, #0284c7 0%, #0369a1 100%);
            --bot-msg-bg: rgba(30, 41, 59, 0.85);
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --border-color: rgba(56, 189, 248, 0.3);
            --neon-glow: rgba(56, 189, 248, 0.25);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        body {
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
            background: linear-gradient(to bottom, rgba(15, 23, 42, 0.4), rgba(15, 23, 42, 0.7)),
                url('https://images.unsplash.com/photo-1519681393784-d120267933ba?q=80&w=2070&auto=format&fit=crop') no-repeat center center fixed;
            background-size: cover;
        }

        .snow-wrapper {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
        }

        .snowflake {
            position: absolute;
            top: -10px;
            background: #ffffff;
            border-radius: 50%;
            opacity: 0.8;
            animation: fall linear infinite;
        }

        @keyframes fall {
            0% {
                transform: translateY(-10vh) translateX(0);
                opacity: 0.9;
            }

            100% {
                transform: translateY(105vh) translateX(50px);
                opacity: 0.2;
            }
        }

        .snowflake:nth-child(1) {
            left: 5%;
            width: 4px;
            height: 4px;
            animation-duration: 8s;
            animation-delay: 0s;
        }

        .snowflake:nth-child(2) {
            left: 15%;
            width: 6px;
            height: 6px;
            animation-duration: 12s;
            animation-delay: 2s;
        }

        .snowflake:nth-child(3) {
            left: 25%;
            width: 3px;
            height: 3px;
            animation-duration: 7s;
            animation-delay: 4s;
        }

        .snowflake:nth-child(4) {
            left: 35%;
            width: 5px;
            height: 5px;
            animation-duration: 10s;
            animation-delay: 1s;
        }

        .snowflake:nth-child(5) {
            left: 45%;
            width: 4px;
            height: 4px;
            animation-duration: 9s;
            animation-delay: 5s;
        }

        .snowflake:nth-child(6) {
            left: 55%;
            width: 7px;
            height: 7px;
            animation-duration: 14s;
            animation-delay: 3s;
        }

        .snowflake:nth-child(7) {
            left: 65%;
            width: 3px;
            height: 3px;
            animation-duration: 8s;
            animation-delay: 6s;
        }

        .snowflake:nth-child(8) {
            left: 75%;
            width: 5px;
            height: 5px;
            animation-duration: 11s;
            animation-delay: 2s;
        }

        .snowflake:nth-child(9) {
            left: 85%;
            width: 4px;
            height: 4px;
            animation-duration: 9s;
            animation-delay: 4s;
        }

        .snowflake:nth-child(10) {
            left: 95%;
            width: 6px;
            height: 6px;
            animation-duration: 13s;
            animation-delay: 1s;
        }

        .chat-container {
            position: relative;
            z-index: 2;
            width: 440px;
            height: 660px;
            background: var(--card-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            box-shadow: 0 0 30px var(--neon-glow), 0 20px 50px rgba(0, 0, 0, 0.6);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .chat-header {
            padding: 18px 22px;
            background: rgba(15, 23, 42, 0.85);
            border-bottom: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .avatar {
            width: 40px;
            height: 40px;
            border-radius: 8px;
            background: var(--accent-gradient);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            box-shadow: 0 0 12px rgba(56, 189, 248, 0.4);
        }

        .header-info h2 {
            font-size: 15px;
            font-weight: 700;
            color: var(--text-primary);
            letter-spacing: 0.5px;
        }

        .status {
            font-size: 12px;
            color: #38bdf8;
            display: flex;
            align-items: center;
            gap: 6px;
            font-weight: 500;
        }

        .status-dot {
            width: 7px;
            height: 7px;
            background-color: #38bdf8;
            border-radius: 50%;
            box-shadow: 0 0 8px #38bdf8;
        }

        .chat-box {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 14px;
            scroll-behavior: smooth;
        }

        .chat-box::-webkit-scrollbar {
            width: 5px;
        }

        .chat-box::-webkit-scrollbar-thumb {
            background: rgba(56, 189, 248, 0.3);
            border-radius: 4px;
        }

        .message {
            max-width: 80%;
            padding: 12px 16px;
            border-radius: 8px;
            font-size: 14px;
            line-height: 1.5;
            word-wrap: break-word;
        }

        .user-msg {
            background: var(--user-msg-bg);
            color: #ffffff;
            align-self: flex-end;
            box-shadow: 0 4px 15px rgba(2, 132, 199, 0.3);
        }

        .bot-msg {
            background: var(--bot-msg-bg);
            color: var(--text-primary);
            align-self: flex-start;
            border: 1px solid var(--border-color);
        }

        .input-area {
            padding: 16px;
            background: rgba(15, 23, 42, 0.85);
            border-top: 1px solid var(--border-color);
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .input-wrapper {
            flex: 1;
        }

        input {
            width: 100%;
            padding: 12px 16px;
            background: rgba(30, 41, 59, 0.8);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            color: var(--text-primary);
            font-size: 14px;
            outline: none;
            transition: all 0.2s ease;
        }

        input::placeholder {
            color: var(--text-secondary);
        }

        input:focus {
            border-color: #38bdf8;
            box-shadow: 0 0 10px rgba(56, 189, 248, 0.3);
        }

        button {
            width: 44px;
            height: 44px;
            border-radius: 8px;
            border: none;
            background: var(--accent-gradient);
            color: white;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease;
            box-shadow: 0 0 12px rgba(56, 189, 248, 0.3);
        }

        button:hover {
            transform: translateY(-1px);
            box-shadow: 0 0 18px rgba(56, 189, 248, 0.6);
        }
    </style>
</head>

<body>

    <div class="snow-wrapper">
        <div class="snowflake"></div>
        <div class="snowflake"></div>
        <div class="snowflake"></div>
        <div class="snowflake"></div>
        <div class="snowflake"></div>
        <div class="snowflake"></div>
        <div class="snowflake"></div>
        <div class="snowflake"></div>
        <div class="snowflake"></div>
        <div class="snowflake"></div>
    </div>

    <div class="chat-container">
        <div class="chat-header">
            <div class="avatar">❄️</div>
            <div class="header-info">
                <h2>spaCy AI Assistant</h2>
                <div class="status">
                    <span class="status-dot"></span> System Online
                </div>
            </div>
        </div>

        <div class="chat-box" id="chatBox">
            <div class="message bot-msg">Welcome! How can I assist you today?</div>
        </div>

        <div class="input-area">
            <div class="input-wrapper">
                <input type="text" id="userInput" placeholder="Type your message..."
                    onkeydown="if(event.key === 'Enter') sendMessage()">
            </div>
            <button onclick="sendMessage()">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
                    stroke-linecap="round" stroke-linejoin="round">
                    <line x1="22" y1="2" x2="11" y2="13"></line>
                    <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
                </svg>
            </button>
        </div>
    </div>

    <script>
        async function sendMessage() {
            const inputField = document.getElementById("userInput");
            const chatBox = document.getElementById("chatBox");
            const userText = inputField.value.trim();

            if (!userText) return;

            // Display User Message
            const userMsgDiv = document.createElement("div");
            userMsgDiv.className = "message user-msg";
            userMsgDiv.textContent = userText;
            chatBox.appendChild(userMsgDiv);

            inputField.value = "";
            chatBox.scrollTop = chatBox.scrollHeight;

            try {
                // Connecting directly to your live Render backend URL
                const response = await fetch("https://spacy-chatbot-app-latest.onrender.com/chat", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({ message: userText })
                });

                const data = await response.json();

                // Display Bot Response
                const botMsgDiv = document.createElement("div");
                botMsgDiv.className = "message bot-msg";
                botMsgDiv.textContent = data.response;
                chatBox.appendChild(botMsgDiv);
                chatBox.scrollTop = chatBox.scrollHeight;

            } catch (error) {
                const errorDiv = document.createElement("div");
                errorDiv.className = "message bot-msg";
                errorDiv.style.color = "#ef4444";
                errorDiv.textContent = "Error: Could not connect to API server.";
                chatBox.appendChild(errorDiv);
            }
        }
    </script>

</body>

</html>
